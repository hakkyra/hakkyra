# REST endpoints mapping to allowed queries in the collection
- name: get_client_by_id
  url: /api/v1/client/:id
  methods:
    - GET
  definition:
    query:
      collection_name: allowed_queries
      query_name: GetClientById
  comment: "Get a single client by UUID"

- name: list_clients
  url: /api/v1/clients
  methods:
    - GET
  definition:
    query:
      collection_name: allowed_queries
      query_name: ListClients
  comment: "List clients with pagination"

- name: get_client_accounts
  url: /api/v1/client/:clientId/accounts
  methods:
    - GET
  definition:
    query:
      collection_name: allowed_queries
      query_name: GetClientAccounts
  comment: "Get all accounts for a client"

- name: list_invoices
  url: /api/v1/invoices
  methods:
    - GET
  definition:
    query:
      collection_name: allowed_queries
      query_name: ListInvoices
  comment: "List invoices with filters"

- name: get_client_summary
  url: /api/v1/client/:clientId/summary
  methods:
    - GET
  definition:
    query:
      collection_name: allowed_queries
      query_name: GetClientSummary
  comment: "Get client summary from materialized view"

- name: list_currencies
  url: /api/v1/currencies
  methods:
    - GET
  definition:
    query:
      collection_name: allowed_queries
      query_name: ListCurrencies
  comment: "List all currencies (valid Hakkyra naming, public)"

- name: list_client_names
  url: /api/v1/client-names
  methods:
    - GET
  definition:
    query:
      collection_name: allowed_queries
      query_name: ListClientNames
  comment: "List client names (valid Hakkyra naming, restricted roles)"

- name: list_active_service_plans
  url: /api/v1/service-plans/active
  methods:
    - GET
  definition:
    query:
      collection_name: allowed_queries
      query_name: ListActiveServicePlans
  comment: "List all active service plans"

# Endpoints for REST query param type coercion (P13.10)
- name: rest_coerce_clients
  url: /api/v1/coerce/clients
  methods:
    - GET
  definition:
    query:
      collection_name: allowed_queries
      query_name: RestCoerceClients
  comment: "Clients with an Int limit variable from query params"

- name: rest_coerce_clients_limited
  url: /api/v1/coerce/clients-limited/:limit
  methods:
    - GET
  definition:
    query:
      collection_name: allowed_queries
      query_name: RestCoerceClients
  comment: "Clients with an Int limit variable from a route param"

- name: rest_coerce_accounts
  url: /api/v1/coerce/accounts
  methods:
    - GET
  definition:
    query:
      collection_name: allowed_queries
      query_name: RestCoerceAccounts
  comment: "Accounts filtered by a Boolean variable from query params"

- name: rest_coerce_clients_by_trust
  url: /api/v1/coerce/clients-by-trust
  methods:
    - GET
  definition:
    query:
      collection_name: allowed_queries
      query_name: RestCoerceClientsByTrust
  comment: "Clients filtered by an [Int!]! variable from query params"
